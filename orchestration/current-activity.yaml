owner_decisions:
  - id: failure_boundary_scope
    decision: >
      Failure scope is provider/runtime execution failure only: provider
      timeout, turn timeout, and generic provider/runtime exception mapped
      through the existing execution-failure boundary. Exclude
      authentication/permission, rate limit/request validation, GatewayError,
      invalid structured response, disabled integration, unrelated transport
      failures, and the existing recursion handoff path.
  - id: recovery_metadata
    reason_code: other
    reason_summary: "Automatic assistance could not complete the conversation and human recovery is required."
    decision: >
      Failure handoff metadata uses reason_code: other and one fixed
      content-free reason_summary meaning automatic assistance could not
      complete the conversation and human recovery is required. Never persist
      provider body, exception text, stack, prompt, patient message,
      credential, or secret.
  - id: duplicate_identity_and_repeat_guard
    decision: >
      Repeated failure reuses the existing open ReceptionHandoff for tenant +
      conversation. Do not add whole-turn idempotency. Preserve the existing
      tool UUIDv4 contract and ReceptionHandoff open-row uniqueness/reuse as
      the business deduplication authority.
  - id: handoff_write_failure_outcome
    decision: >
      If handoff persistence fails, never fabricate recovery. Preserve the
      original public provider/runtime failure response and sanitized
      diagnostic behavior; claim a durable handoff only after the backend
      command commits.
