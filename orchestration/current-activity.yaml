acceptance:
  observable_outcome: >
    An authenticated, tenant-scoped human can list and read AIRY's pending
    proposals and turn exactly one into exactly one appointment, or decline it —
    with agents refused before replay or mutation, safe idempotent replay,
    serialized concurrent confirmation, fail-closed expiry, and transactionally
    consistent proposal/receipt/audit outcomes.
  required_checks:
    - authorized proposal list/read; cross-tenant and cross-location denial
    - human confirm creates exactly one appointment; human decline creates none
    - agent refusal precedes the confirmed-replay branch
    - same-key replay returns the same outcome without a second appointment or audit
    - concurrent confirms yield exactly one winner
    - expired and slot-conflicting proposals fail closed
    - decline sets `expired` and records `appointment_proposal.declined`; repeat is idempotent
    - existing direct-booking and Sales Agent tests stay green
    - OpenAPI regenerated; one serial full PostgreSQL suite green

