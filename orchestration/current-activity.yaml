# The seven amendments are the authorized contract; they are not re-decidable
# here. Source: the contract-amendment decision, section "Minimum amendment set".
authorized_contract:
  - "decline = status `expired` + audit action `appointment_proposal.declined`; idempotent; refuses a confirmed proposal; conversation returns to open"
  - "gate new confirm/decline routes on `ctx.principal_type == 'human'` (allow-list, not `!= 'agent'`)"
  - "apply `_require_later_inbound_message` only when `ctx.principal_type != 'human'`"
  - "move agent refusal ahead of the confirmed-replay branch, extracted as `require_human_confirmation(ctx)` for AGENT-03 to reuse"
  - "pass `location_id=proposal.location_id` to `require_permission` in confirm"
  - "require canonical UUIDv4 `Idempotency-Key` on confirm and decline via the existing `require_uuid4_idempotency_key`"
  - "regenerate docs/api/openapi.{yaml,json}; add tests/test_appointment_proposals.py covering the six DoD cases"

