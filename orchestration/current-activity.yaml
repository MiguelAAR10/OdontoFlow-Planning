# Lifecycle contract (added 2026-09-17 by the harness entry-point repair).
# `lifecycle_state` is the ONE enumerated field the entry point branches on.
# The free-text `status:` below stays for humans; routing must never parse it.
lifecycle_contract:
  states:
    NEEDS_PRODUCT_DISCOVERY: new or materially ambiguous product work — Opus runs discovery, produces SPEC + product delivery plan, stops for owner approval
    SPEC_APPROVED: approved product contract — targeted functional validation, then technical design, emit Activity Card + SubCards
    READY_TO_BUILD: validated and authorized — dispatch one writer per surface and work dependency-ready SubCards; do NOT produce another validation report
    IN_PROGRESS: keep working the SAME card's remaining dependency-ready SubCards; never auto-start a different card
    NEEDS_VERIFICATION: verify against acceptance, then write the self-contained handoff
    KNOWN_FIX: bounded known repair — implement directly, no SPEC, no discovery, no decomposition
    BLOCKED_OWNER_DECISION: present decision + options + trade-offs and stop
    CONTRACT_CONTRADICTION: return to owner with the cited contradiction; preserve every unaffected completed SubCard
    DONE: nothing further; report and wait for an explicit owner choice
  rules:
    - "validation PASS is `validation.result`, never `lifecycle_state`; a
       written validation report is not a stopping point for an authorized card"
    - "READY_TO_BUILD requires `implementation_authorized: true`; without it the
       effective state is BLOCKED_OWNER_DECISION"
    - "a SubCard is dispatchable only when every dependency is done and no
       in-flight SubCard claims an overlapping write_ownership path"
    - "`advance_automatically: false` is in force for every state — it forbids
       starting a DIFFERENT Activity Card, never the completion of this one's
       authorized SubCards"

