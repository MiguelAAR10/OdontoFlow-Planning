    - mutation headers and ApiError/toApiError behavior remain intact
    - no Clerk, Supabase browser client/Auth, BFF/Route Handler, Server Action or GCP artifact exists
    - no contributor-owned behavior is rewritten and no redesign is introduced
    - focused tests, typecheck, build, E2E and visual/browser evidence pass at implementation time

