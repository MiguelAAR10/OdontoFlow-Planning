FACTS:
  - id: F1
    statement: >-
      The approved Reception/Scheduling closeout seed classifies AGENT-02 as
      MUST_CLOSE_V1 with no dependencies. Its card requires one pending
      tenant-bound recovery handoff after authenticated provider/runtime failure.
    evidence: [W3.E1, W1.F011, seed:docs/handoffs/plans/2026-09-17-reception-core-closeout-01.yaml#AGENT-02]
  - id: F2
    statement: >-
      POST /sales-agent/turn authenticates and resolves tenant/principal and
      conversations.read permission before invoking the runtime. Generic
      provider/runtime exceptions map to AGENT_EXECUTION_FAILED HTTP 503;
      invalid structured responses map to HTTP 502 and typed gateway errors
      retain their mapped status/code.
    evidence: [W1.F001, W1.F002, W1.F004, W3.F1, W3.E2]
  - id: F3
    statement: >-
      Failure diagnostics are bounded and sanitized but currently go through
      application logging; the inspected runtime failure boundary does not
      persist a canonical diagnostic or invoke the durable handoff command.
    evidence: [W1.F005, W1.F006, W1.F010, W1.E011, W2.overall, W2.E20, W3.F2]
  - id: F4
    statement: >-
      Authentication commits credential last-use metadata before runtime.
      Typed tool operations use separate transactions, so a successful prior
      tool mutation can remain committed when a later provider/runtime call fails.
    evidence: [W1.F007, W1.F008, W1.E004, W1.E016, W2.F05, W3.F5]
  - id: F5
    statement: >-
      Source and existing tests show no provider retry, alternate-provider
      fallback, or whole-turn retry in this path. A separate recursion-limit
      branch invokes explicit handoff; that is distinct from generic provider failure.
    evidence: [W1.F009, W1.F010, W1.E009, W1.E022, W2.F14, W3.F3, W3.F6]

CURRENT_FAILURE_FLOW:
  - step: authenticated_entry
    observation: >-
      Credential-derived tenant and principal plus conversations.read are
      checked before the Sales Agent runtime executes.
    evidence: [W1.F001, W1.F002, W1.E003, W1.E004, W3.E2]
  - step: runtime_execution
    observation: >-
      Runtime stages include inbound-context loading, agent construction,
      model execution, response validation, and deadline checks; typed tool
      calls can commit independently during execution.
    evidence: [W1.F003, W1.F007, W1.F008, W1.E006, W1.E016, W1.E018]
  - step: failure_translation
    observation: >-
      Generic provider/runtime failure is logged through the sanitized
      diagnostic path and returned as the existing 503 envelope with trace
      identifiers only; no generic failure branch creates a handoff.
    evidence: [W1.F004, W1.F005, W1.F006, W1.F010, W1.E010, W1.E011, W2.E20, W3.E2, W3.E5]
  - step: retry_behavior
    observation: >-
      Provider retry is disabled, typed gateway calls have no retry loop, and
      the workflow caller uses one turn attempt; transport-only retries are
      separately bounded in the workflow evidence.
    evidence: [W1.F009, W1.E007, W1.E009, W1.E022, W3.E6, W3.E9]

CURRENT_HANDOFF_FLOW:
  persistence_and_states:
    observation: >-
      PostgreSQL ReceptionHandoff rows are linked to tenant-scoped Conversation
      and ContactIdentity records. Handoff states are pending, claimed, and
      resolved; the conversation automation gate includes human_handoff.
    evidence: [W2.F01, W2.F02, W2.F03, W2.E02, W2.E03]
  creation_and_deduplication:
    observation: >-
      request_handoff / run_handoff_tool requires conversations.manage, loads
      within the authenticated tenant, reuses an open handoff or inserts one,
      changes conversation status, records audit and idempotency state in the
      transaction. A partial unique index permits one pending/claimed handoff
      per tenant and conversation.
    evidence: [W2.F03, W2.F04, W2.F08, W2.F09, W2.F10, W2.E05, W2.E10, W2.E11]
  callers_and_resume:
    observation: >-
      Explicit tool requests and the recursion-limit branch call the handoff
      command. Operator resume resolves pending/claimed rows, reopens the
      conversation, and audits the change; it does not invoke the Sales Agent
      runtime, replay the failed turn, or coordinate the separate memory
      checkpointer.
    evidence: [W2.F07, W2.F11, W2.F12, W2.E06, W2.E16, W2.E19, W2.E26, W3.E7, W3.E8]
  current_failure_boundary:
    observation: >-
      Provider/runtime failure handling does not call request_handoff or
      resume_automation. The existing handoff mechanism is therefore present
      but not connected to this failure boundary.
    evidence: [W2.overall, W2.provider_runtime_failure_boundary, W2.E20, W2.E27, W3.F2]

REUSABLE_CONTRACTS:
  - id: R1
    statement: >-
      Existing tenant-bound handoff persistence, one-open-row uniqueness,
      explicit command idempotency, automation blocking, permission checks,
      and audit behavior are established source contracts.
    evidence: [W2.reuse_assessment, W2.F03, W2.F04, W2.F05, W2.F08, W2.F09, W2.F10]
  - id: R2
    statement: >-
      Existing operator resume is permission-gated and idempotent, but only
      resolves the human-handoff state; it does not resume or replay AI work.
    evidence: [W2.F11, W2.F12, W2.F17, W2.E06, W2.E16]
  - id: R3
    statement: >-
      Existing tests cover the public trace-only 503 contract, explicit
      handoff persistence/replay, provider retry controls, and related tenant
      and audit behavior. They do not establish generic failure-to-handoff behavior.
    evidence: [W3.A3, W3.E5, W3.E6, W3.E8, W3.E11]

