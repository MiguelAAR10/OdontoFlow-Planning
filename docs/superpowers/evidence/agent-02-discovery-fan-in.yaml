RISKS:
  - id: RISK1
    statement: >-
      A later runtime failure does not roll back an earlier separately
      committed typed-tool mutation; the inspected failure contract does not
      yet establish how duplicate business effects are prevented on a repeated turn.
    evidence: [W1.F007, W1.F008, W1.E016, W3.G3, W3.U1]
  - id: RISK2
    statement: >-
      ReceptionHandoff.reason_summary is persisted caller-provided text, so
      the existing explicit-handoff contract alone does not prove the
      failure-created recovery metadata would exclude all prohibited content.
    evidence: [W2.F02, W2.E08, W3.G4, W3.U2]
  - id: RISK3
    statement: >-
      The existing resume operation changes canonical handoff/conversation
      state but has no source-level runtime replay or separate-memory recovery behavior.
    evidence: [W2.F11, W2.G05, W2.U03]
  - id: RISK4
    statement: >-
      The turn endpoint has no idempotency contract in inspected source;
      explicit handoff command idempotency does not dedupe repeated turn requests.
    evidence: [W2.F08, W2.F09, W2.G06, W2.E21]

