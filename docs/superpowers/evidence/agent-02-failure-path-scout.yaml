findings:
  authenticated_entrypoint:
    status: "established"
    route:
      method: "POST"
      path: "/sales-agent/turn"
      request_contract: "SalesAgentTurnRequest carries conversation_id and latest_inbound_message_id."
      response_contract: "SalesAgentTurnResponse."
    dependency_order:
      - "SecurityBoundaryMiddleware decorates/validates trace headers and body transport before FastAPI route execution."
      - "require_authenticated_context resolves the bearer credential, tenant, principal, rate limit, request trace, and commits credential last-use metadata in a short-lived authentication session."
      - "_authorize_sales_agent_turn requires the configured service credential, an agent principal, and conversations.read permission before runtime invocation."
      - "sales_agent_turn builds or obtains the runtime and then calls active_runtime.turn(payload)."
    evidence_refs: [E002, E003, E004]

  canonical_tool_entrypoint:
    status: "established"
    route: "POST /agent-tools/call"
    path: "app.agent_tools.router.call_tool_route"
    behavior: "The backend route resolves the authenticated ExecutionContext and delegates to call_agent_tool with a request-scoped SQLAlchemy Session."
    authentication: "The canonical app includes the agent-tools router with require_authenticated_context as a router dependency."
    evidence_refs: [E005, E014]

  runtime_failure_boundary:
    status: "established"
    turn_stages:
      - name: "turn_deadline_precheck"
        operation: "SalesAgentRuntime._ensure_turn_deadline"
        evidence_refs: [E006]
      - name: "inbound_context"
        operation: "BackendGateway.load_latest_inbound_message through get_reception_context over POST /agent-tools/call"
        failure_types: ["GatewayError", "GatewayContractError", "SalesAgentTurnTimeout"]
        evidence_refs: [E006, E007]
      - name: "agent_build"
        operation: "SalesAgentRuntime._build_agent and _resolve_model"
        failure_types: ["AgentUnavailableError", "configuration/import errors"]
        evidence_refs: [E006, E009]
      - name: "model_execution"
        operation: "LangChain agent.invoke with ModelTelemetryMiddleware"
        failure_types: ["SalesAgentProviderTimeout", "provider SDK errors wrapped as SalesAgentExecutionError", "SalesAgentTurnTimeout"]
        evidence_refs: [E006, E008]
      - name: "response_validation"
        operation: "SalesAgentResponse validation and response assembly"
        failure_types: ["ValueError for invalid structured response"]
        evidence_refs: [E006, E010]
    exact_boundary_observation: "The runtime records the current stage, classifies the exception without retaining its text, and re-raises a typed or generic runtime exception; the API boundary performs the public translation."
    evidence_refs: [E006, E010, E024]

  exception_translation:
    status: "established"
    runtime_translation:
      - source: "SalesAgentTurnTimeout or SalesAgentProviderTimeout"
        behavior: "Attach SalesAgentDiagnostic and re-raise; both are RuntimeError subclasses at the API boundary."
        evidence_refs: [E006, E010]
      - source: "GatewayError, AgentUnavailableError, or ValueError raised by turn"
        behavior: "Attach a diagnostic and re-raise the original typed exception."
        evidence_refs: [E006, E010]
      - source: "Other exception from turn"
        behavior: "Classify it and wrap it as SalesAgentExecutionError with a generic safe message; no original exception text is serialized."
        evidence_refs: [E006, E010, E024]
      - source: "GraphRecursionError"
        behavior: "The runtime attempts the typed request_human_handoff tool and returns a handoff response; handoff-tool exceptions are counted and swallowed by _request_handoff."
        evidence_refs: [E006]
    api_translation:
      - source: "GatewayError"
        public_status: "exc.status_code or 502"
        public_code: "exc.code"
        public_details: "Only validated request_id and correlation_id are included; gateway details are not copied into the response."
        evidence_refs: [E010]
      - source: "AgentUnavailableError"
        public_status: 503
        public_code: "AGENT_UNAVAILABLE"
        public_details: "Only validated trace IDs."
        evidence_refs: [E002, E010]
      - source: "ValueError"
        public_status: 502
        public_code: "INVALID_AGENT_RESPONSE"
        public_details: "Only validated trace IDs."
        evidence_refs: [E010]
      - source: "RuntimeError, including SalesAgentExecutionError and provider/turn timeout subclasses"
        public_status: 503
        public_code: "AGENT_EXECUTION_FAILED"
        public_details: "Only validated trace IDs."
        evidence_refs: [E010, E024]
    pre_runtime_translation:
      - "Authentication failure is an AppError response before route body execution; the authentication gate records a redacted SecurityEvent and commits it."
      - "Permission failure is an AppError response before runtime execution."
      - "Rate limit and disabled-integration failures are transport AppError responses before runtime execution."
      - "Request trace/body transport failures are rejected by SecurityBoundaryMiddleware before the route."
      - "The route catches only AgentUnavailableError from _build_runtime; other runtime-construction exceptions are not explicitly translated in this source."
    evidence_refs: [E003, E004, E010, E013]

  public_http_behavior:
    status: "established"
    success: "A successful turn returns the typed response containing the conversation and inbound identifiers, reply, outcome, and handoff flag."
    provider_or_runtime_failure: "A provider/runtime failure reaches the existing generic AGENT_EXECUTION_FAILED 503 envelope unless it remains a GatewayError, AgentUnavailableError, or ValueError at the listed translation branch."
    diagnostic_visibility: "The public failure response includes trace IDs only; diagnostic stage, category, upstream status, and upstream request ID are not public response fields."
    no_provider_body: "The public response does not include provider response bodies or raw exception text."
    historical_confirmation: "The real-model diagnostics handoff records the prior path as runtime exception to generic 503, while the bounded-smoke handoff records a 503 after the canonical context load."
    evidence_refs: [E010, E024, E025]

  sanitized_diagnostic_persistence:
    status: "established_source_behavior"
    diagnostic_shape:
      fields: ["stage", "category", "upstream_status", "upstream_request_id", "elapsed_ms", "partial_business_effects"]
      allowlisting: "stage and category are restricted to enumerated values; status is limited to HTTP status range; request ID is restricted by a bounded safe pattern; elapsed time is non-negative."
      content_policy: "The diagnostic classifier and handoff contract exclude raw exception text, provider bodies, headers, credentials, stack traces, and patient message text."
      evidence_refs: [E011, E012, E024]
    current_recording:
      api_boundary: "_record_failure chooses an attached diagnostic or classifies at request_boundary, adds validated trace IDs, and emits one sales_agent_failure warning through Python logging."
      runtime_telemetry: "SalesAgentRuntime finally emits the existing aggregate telemetry event through its telemetry_sink; this event does not persist the diagnostic object to PostgreSQL."
      evidence_refs: [E006, E011]
    durable_storage:
      canonical_database_diagnostic_row: "not present in the inspected source"
      post_auth_failure_database_write_from_sales_agent_api: "none"
      security_event_scope: "SecurityEvent is staged only by authentication failure and rate-limit branches in app.context, not by sales_agent.api runtime failure handling."
      tool_audit_scope: "AuditEvent rows record typed tool calls and domain commands; no sales_agent_failure AuditEvent write exists in the runtime/API path."
      logger_sink_durability: "unknown_outside_repository_source"
      evidence_refs: [E011, E013, E014, E024]

  mutations_before_failure:
    status: "established_possible_effects"
    authentication_metadata:
      effect: "A successful authenticated turn updates IntegrationCredential.last_used_at and commits before the route body invokes the runtime."
      business_effect: false
      evidence_refs: [E004]
    inbound_precondition:
      effect: "The canonical inbound message and conversation identity are persisted by a separate authenticated inbound command before the turn; the turn request itself carries only canonical identifiers and the runtime reads context through a typed tool."
      transaction: "ingest_inbound_message uses its own session.begin transaction."
      evidence_refs: [E006, E021, E026]
    read_tool_effects:
      effect: "Every successful typed tool call commits an agent_tool.called AuditEvent; an AppError tool outcome is also audited and committed before the stable tool error is returned."
      business_effect: false
      evidence_refs: [E014, E015]
    sales_agent_mutation_tools:
      tool_set: ["propose_appointment", "confirm_appointment", "request_human_handoff"]
      evidence_refs: [E013]
      propose_appointment:
        function: "app.agent_tools.booking.create_contact_booking_proposal"
        possible_committed_effects:
          - "Create or bind a Patient and Lead through ensure_contact_profile when the contact lacks them."
          - "Update the lead service need."
          - "Expire earlier pending proposals for the conversation."
          - "Create one pending AppointmentProposal and set the conversation to awaiting_confirmation."
          - "Persist the command receipt and appointment_proposal.created audit event."
        transaction: "One session.begin block contains the receipt claim, permission/read checks, profile changes, proposal changes, audit staging, and receipt settlement."
        evidence_refs: [E016, E017, E020]
      confirm_appointment:
        function: "app.agent_tools.booking.confirm_contact_booking_proposal"
        possible_committed_effects:
          - "Create the Appointment after the command's human-confirmation guard and later-inbound check."
          - "Mark the proposal confirmed and bind its appointment."
          - "Set the conversation open."
          - "Persist the command receipt and appointment_proposal.confirmed audit event."
        transaction: "One session.begin block contains the receipt claim, proposal lock, confirmation checks, appointment creation, state changes, audit staging, and receipt settlement."
        evidence_refs: [E018, E020]
      request_human_handoff:
        function: "app.agent_tools.reception.request_handoff"
        possible_committed_effects:
          - "Create or reuse one pending/claimed ReceptionHandoff for the tenant and conversation."
          - "Set the conversation to human_handoff."
          - "Persist the command receipt and conversation.human_handoff_requested audit event."
        transaction: "One session.begin block contains the receipt claim, conversation lock, handoff write/reuse, conversation status change, audit staging, and receipt settlement."
        duplicate_guard: "The ReceptionHandoff table has a tenant/conversation partial unique index for pending or claimed handoffs."
        evidence_refs: [E019, E020]
    cross_turn_effect: "The Sales Agent turn has no encompassing canonical transaction. A provider failure after a successful tool call cannot roll back the earlier tool request's committed transaction."
    agent_memory_effect: "The runtime passes a separate PostgresSaver checkpointer for the conversation thread; its storage is outside canonical business state. Exact checkpoint write timing around a provider failure is not established by this repository source."
    evidence_refs: [E006, E023]

  retry_and_fallback:
    status: "established"
    provider_runtime:
      - "Model construction passes max_retries=0, a bounded model timeout, and a bounded output-token limit."
      - "BackendGateway.call_tool performs one HTTP POST per typed tool call and has no retry loop."
      - "SalesAgentRuntime has no alternate-provider or alternate-model fallback branch."
      - "The only bounded automatic handoff branch is GraphRecursionError; it is not provider fallback and is not reached by the generic provider-exception path."
    evidence_refs: [E007, E009, E010]
    caller_workflow:
      - "WF01Runner uses max_attempts=1 for POST /sales-agent/turn."
      - "The same runner permits bounded transport retries for inbound and outbound commands, but those are separate requests and do not retry the turn."
      - "After a failed turn, the runner does not reach the outbound enqueue call."
    evidence_refs: [E022, E026]
    command_idempotency:
      - "Mutation tool envelopes receive a fresh UUIDv4 idempotency key per BackendGateway.call_tool invocation."
      - "run_idempotent_command replays only a matching prior key/fingerprint/principal and does not itself retry."
      - "No whole-turn idempotency key or whole-turn replay exists in the current turn contract."
    evidence_refs: [E007, E020, E025]
    current_failure_recovery: "A generic post-auth provider/runtime failure is not automatically converted into request_human_handoff, retried, or routed to another provider."
    evidence_refs: [E006, E010, E024, E025]

  transaction_boundaries_for_human_recovery:
    status: "established"
    boundaries:
      - boundary: "authenticated_turn_gate"
        transaction: "Short-lived auth session resolves credential/context, rate limit, and last-use metadata; it commits and closes before turn execution."
        evidence_refs: [E004]
      - boundary: "sales_agent_turn"
        transaction: "No canonical SQLAlchemy transaction is opened by sales_agent_turn or SalesAgentRuntime.turn; runtime calls canonical tools over HTTP."
        evidence_refs: [E006, E007, E023]
      - boundary: "typed_tool_request"
        transaction: "Backend get_db supplies a request session; call_agent_tool commits its tool audit on success or AppError, while mutation services own separate session.begin transactions."
        evidence_refs: [E014, E015, E020]
      - boundary: "human_handoff_command"
        transaction: "request_handoff atomically writes/reuses the handoff, changes conversation status, stages audit, and settles the idempotency receipt."
        evidence_refs: [E019, E020]
      - boundary: "outbound_transcript"
        transaction: "Outbound message and queue row are persisted by a separate enqueue_outbound_message session.begin transaction only after a successful turn response."
        evidence_refs: [E021, E022]
      - boundary: "diagnostic_record"
        transaction: "The failure diagnostic is emitted through logging; no transaction connects it to a ReceptionHandoff or canonical conversation mutation."
        evidence_refs: [E011, E013, E024]
    recovery_state_observation: "The existing durable human state is the ReceptionHandoff row created by an explicit handoff tool call, not a provider/runtime failure record."
    evidence_refs: [E019, E024, E025]

  source_vs_contract:
    status: "established_discrepancy"
    existing_contract: "The reception closeout contract says provider/runtime/transport/ingress failure should leave sanitized evidence and one recoverable human state; its AGENT-02 card names one tenant-bound pending handoff after every post-auth failure."
    current_source: "The source has sanitized logger diagnostics and a durable explicit request_human_handoff command, but the sales_agent.api failure branches do not call that command or otherwise persist a pending handoff."
    scope_boundary: "This scout records the discrepancy only; it does not infer the intended recovery implementation or propose an architecture."
    evidence_refs: [E019, E024, E025]

