facts:
  - id: "F001"
    statement: "The authenticated Sales Agent entrypoint is POST /sales-agent/turn in the separate sales_agent.api FastAPI app."
    evidence_refs: [E002, E003]
  - id: "F002"
    statement: "Authentication, tenant binding, agent-principal validation, and conversations.read authorization complete before runtime invocation."
    evidence_refs: [E003, E004]
  - id: "F003"
    statement: "The runtime's explicit failure stages are inbound context, agent build, model execution, and response validation, with deadline checks around them."
    evidence_refs: [E006, E007, E009]
  - id: "F004"
    statement: "Generic provider/runtime exceptions become AGENT_EXECUTION_FAILED with HTTP 503; invalid structured output becomes INVALID_AGENT_RESPONSE with HTTP 502; typed gateway errors preserve their typed code/status branch."
    evidence_refs: [E006, E010, E024]
  - id: "F005"
    statement: "The public failure response carries only validated trace IDs in details; the sanitized diagnostic is not returned as stage/category data."
    evidence_refs: [E010, E011, E012]
  - id: "F006"
    statement: "Current sanitized diagnostic handling is application logging, not durable canonical persistence."
    evidence_refs: [E011, E013, E024]
  - id: "F007"
    statement: "A successful turn may leave committed authentication metadata, tool audit rows, and any successful typed-tool business mutations before a later provider/runtime failure."
    evidence_refs: [E004, E014, E015, E016, E018, E019]
  - id: "F008"
    statement: "Proposal, confirmation, and explicit human-handoff commands own separate transactions; no transaction spans the entire Sales Agent turn."
    evidence_refs: [E006, E016, E018, E019, E020]
  - id: "F009"
    statement: "The current provider/runtime path has no provider retry, alternate-provider fallback, or whole-turn retry; the integration caller makes one turn attempt."
    evidence_refs: [E007, E009, E022, E024, E025]
  - id: "F010"
    statement: "An explicit request_human_handoff tool call can create one tenant-bound pending handoff and block later automation, but the Sales Agent API failure branches do not invoke it."
    evidence_refs: [E019, E027]
  - id: "F011"
    statement: "The existing closeout/AGENT-02 contract records durable post-auth human recovery as unfinished; this is a source-versus-contract discrepancy, not an inferred recovery design."
    evidence_refs: [E024, E025]

unknowns:
