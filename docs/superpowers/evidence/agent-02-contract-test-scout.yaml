acceptance_map:
  - id: "A1"
    statement: "One pending, tenant-bound handoff exists after one authenticated provider/runtime failure."
    status: "absent"
    evidence_refs: ["E1", "E2", "E3", "E4", "E5", "E6"]
    evidence_summary: "The seed names this as the required contract, but sales_agent_turn maps generic RuntimeError failures to the existing error response and sanitized diagnostic; the runtime only invokes its typed handoff wrapper in the explicit GraphRecursionError branch. The existing authenticated failure test asserts 503 and diagnostics, not a ReceptionHandoff row, and the seed-named failure-handoff test file is absent."
    boundary_note: "An explicit recursion-bound handoff is separately covered by E7; that is not evidence that provider/runtime failures generally create a handoff."

  - id: "A2"
    statement: "A repeat failure does not create a second open handoff for the conversation."
    status: "partially_covered"
    evidence_refs: ["E4", "E8", "E9"]
    evidence_summary: "The explicit request_handoff tool reuses an existing pending/claimed handoff under a transaction, and its test calls the same tool twice with one idempotency key and observes one row. The model also has a partial unique index for open handoffs per organization and conversation. No existing test drives two provider/runtime failures through the authenticated turn, and no test establishes the independent-repeat-failure behavior required by A2."

  - id: "A3"
    statement: "The existing public provider/runtime failure response remains HTTP 503 with the established content-free envelope."
    status: "covered"
    evidence_refs: ["E5", "E12"]
    evidence_summary: "The authenticated Sales Agent failure contract test asserts status 503, code AGENT_EXECUTION_FAILED, and details limited to request_id and correlation_id while checking one runtime call and sanitized diagnostic logging. The prior handoff records the same public 503 boundary and describes the envelope as content-free."
    coverage_limit: "The focused API test uses a synthetic runtime failure; provider-specific classification is tested at the runtime boundary in E6 rather than through a provider-backed HTTP request."

  - id: "A4"
    statement: "There is no hidden retry/fallback and no duplicate business mutation around the failure."
    status: "partially_covered"
    evidence_refs: ["E6", "E7", "E9", "E10", "E12", "E13"]
    evidence_summary: "Runtime model controls set max_retries to zero; the unknown-failure test asserts that no tool call is retried; the workflow calls the Sales Agent turn once while keeping transport retry only for inbound/outbound persistence; and the sandbox timeout test observes one Sales Agent call with no fabricated outbound. Existing idempotency and explicit handoff tests cover other command paths, but no test combines a provider/runtime failure with a preceding successful mutating tool effect and checks all business rows for duplication."

  - id: "A5"
    statement: "Recovery metadata persists no credential, provider body, exception text, or patient message text."
    status: "partially_covered"
    evidence_refs: ["E4", "E6", "E11", "E12"]
    evidence_summary: "Runtime diagnostics and the API response/log test cover content-free provider diagnostics, and the agent-tool audit test excludes prompt content. The current failure path has no durable recovery metadata write to inspect; the explicit handoff service persists its caller-provided reason_summary, so the inspected evidence does not prove that a failure-created recovery row would be sanitized."
    material_source_fact: "ReceptionHandoff.reason_summary is a persisted 5-500 character field populated from HumanHandoffArguments; current generic provider/runtime failure handling does not populate it."

  - id: "A6"
    statement: "Tenant isolation remains intact for the failure handoff and its recovery metadata."
    status: "partially_covered"
    evidence_refs: ["E4", "E10", "E11", "E13"]
    evidence_summary: "Authentication tests reject a valid Sales Agent from another tenant; general messaging, tenant-integrity, and idempotency tests prove tenant-scoped resources and same-key isolation; request_handoff queries and creates by ctx.organization_id and the handoff table uses composite tenant foreign keys. No test invokes the provider/runtime failure path with two tenants and checks that only the authenticated tenant receives an open handoff."

