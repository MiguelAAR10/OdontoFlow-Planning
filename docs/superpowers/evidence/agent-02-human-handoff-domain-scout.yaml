artifact:
  kind: human_handoff_domain_scout
  activity_id: AGENT-02
  task_id: task_d1aa69764c9d
  agent: AGENT-02
  generated_on: "2026-09-23"
  evidence_only: true

scope:
  objective: >-
    Map the existing backend Human Handoff domain, services, callers, and
    recovery behavior so AGENT-02 can assess reuse without introducing a second
    recovery architecture.
  repository_inspected: ../odontoflow-backend
  planning_repository: .
  included:
    - declared Conversation and ReceptionHandoff persistence models and migrations
    - conversation and handoff states and observed transitions
    - tenant binding, authentication, authorization, and operator profiles
    - handoff command/tool dispatch and idempotency behavior
    - audit events and failure diagnostics already present
    - existing Sales Agent, agent-tool, messaging-route, and contract callers
    - operator resume behavior and its connection to runtime recovery
    - relevant planning seed and backend handoff/reality documents
  excluded:
    - implementation or edits in odontoflow-backend
    - test execution, database inspection, schema introspection, and live services
    - .env files, credentials, production systems, live databases, and patient/provider content

backend_head:
  repository: ../odontoflow-backend
  head: 02fb031c6949c1c5ea69278a9e9a33a4cbb17f72
  origin_main: 02fb031c6949c1c5ea69278a9e9a33a4cbb17f72
  merge_base: 02fb031c6949c1c5ea69278a9e9a33a4cbb17f72
  relation_to_origin_main: equal
  relevant_source_diff_from_head: []
  worktree_note: >-
    The backend worktree is dirty in setup/documentation paths, but the
    inspected app, sales_agent, alembic, and test source paths have no tracked
    diff from HEAD. This report describes the current checked-out source and
    records HEAD explicitly.
  evidence_refs: [E01]

findings:
  overall:
    statement: >-
      A durable, tenant-bound human handoff mechanism already exists. It is
      complete for an explicit typed handoff request and operator resume, but
      the Sales Agent provider/runtime failure boundary currently records only a
      sanitized diagnostic and returns a 503; it does not invoke the durable
      handoff command.
    evidence_refs: [E05, E06, E20, E27, E29]
  persistence:
    statement: >-
      ReceptionHandoff is a PostgreSQL-backed model linked to one Conversation
      and one ContactIdentity. Conversation carries the automation gate, while
      ReceptionHandoff carries controlled reason data, lifecycle status, and
      timestamps.
    evidence_refs: [E02, E03]
  states_and_transitions:
    conversation_statuses:
      allowed: [open, awaiting_confirmation, human_handoff, closed]
      evidence_refs: [E02, E16]
    handoff_statuses:
      allowed: [pending, claimed, resolved]
      evidence_refs: [E02, E03]
    transitions:
      - domain: conversation
        from: [absent]
        to: open
        trigger: ingest_inbound_message creates a new conversation
        evidence_refs: [E15]
      - domain: conversation
        from: [open, awaiting_confirmation]
        to: awaiting_confirmation
        trigger: appointment proposal creation
        evidence_refs: [E17]
      - domain: conversation
        from: [awaiting_confirmation]
        to: open
        trigger: proposal confirmation or decline
        evidence_refs: [E17]
      - domain: conversation
        from: [open, awaiting_confirmation]
        to: human_handoff
        trigger: request_handoff after the automation-active guard
        evidence_refs: [E05, E07]
      - domain: conversation
        from: [open, awaiting_confirmation, human_handoff]
        to: open
        trigger: resume_automation on a non-closed conversation
        evidence_refs: [E06]
      - domain: conversation
        from: [open, awaiting_confirmation, human_handoff]
        to: closed
        trigger: close_conversation
        evidence_refs: [E15]
      - domain: reception_handoff
        from: [absent]
        to: pending
        trigger: request_handoff when no pending or claimed row exists
        evidence_refs: [E05]
      - domain: reception_handoff
        from: [pending, claimed]
        to: resolved
        trigger: resume_automation
        evidence_refs: [E06]
      - domain: reception_handoff
        from: [pending]
        to: claimed
        observed: false
        trigger: null
        note: claimed is allowed by the schema, but no source assignment path was found
        evidence_refs: [E24, E30]
    observed_transition_contract: >-
      New inbound conversations are opened; proposal flows move conversations
      to awaiting_confirmation and successful/declined proposal flows return
      them to open; an explicit handoff sets human_handoff; operator resume
      resolves pending/claimed handoffs and sets the conversation open; close
      sets a non-closed conversation closed. The source has no handoff claim
      assignment path.
    evidence_refs: [E05, E06, E15, E17, E30]
  tenant_binding:
    statement: >-
      The HTTP execution context derives organization and principal from the
      authenticated credential and PostgreSQL membership, not request body or
      headers. Handoff queries additionally filter organization_id, and the
      model has composite foreign keys from organization_id to the conversation
      and contact rows.
    evidence_refs: [E02, E12, E13, E14]
  creation_command_service_tool:
    statement: >-
      The application command is request_handoff in app.agent_tools.reception;
      run_handoff_tool wraps it in the generic idempotent command handler; the
      generic POST /agent-tools/call route dispatches request_human_handoff to
      that wrapper. There is no separate handoff REST-create route in the
      inspected backend source.
    evidence_refs: [E05, E08, E09, E18, E30]
  dedupe_and_idempotency:
    statement: >-
      Mutation tool envelopes require version 1.1 and UUIDv4 idempotency keys.
      The handoff operation is recorded as conversations.request_handoff in
      command_receipts, whose organization/operation/key uniqueness and
      fingerprint/principal comparison replay a matching request and reject a
      collision with different request identity. A PostgreSQL partial unique
      index permits at most one pending or claimed handoff per organization and
      conversation.
    evidence_refs: [E02, E08, E10, E11]
  permission_checks:
    statement: >-
      Handoff creation requires conversations.manage inside the transaction;
      resume requires conversations.resume. Router-level bearer authentication
      resolves the tenant context first. The sales-agent-v0 profile has manage
      but not resume; reception-operator has read and resume only.
    evidence_refs: [E05, E06, E12, E13, E14, E22]
  audit_behavior:
    statement: >-
      request_handoff atomically stages conversation.human_handoff_requested;
      resume atomically stages conversation.automation_resumed; both use the
      ExecutionContext-derived tenant, actor, request, and correlation values.
      The generic agent-tool boundary also stages agent_tool.called for success
      and AppError outcomes. The Sales Agent HTTP failure boundary emits a
      content-free logger record, not a canonical AuditEvent or handoff row.
    evidence_refs: [E05, E06, E09, E20, E27]
  existing_callers:
    statement: >-
      The explicit handoff is callable from the Sales Agent V0 wrapper and from
      the generic authenticated agent-tool gateway. The bounded runtime calls
      the same typed wrapper on GraphRecursionError. The operator resume route
      calls resume_automation through the generic idempotent command handler.
    evidence_refs: [E06, E09, E18, E19, E25]
  resume_and_recovery:
    statement: >-
      POST /internal/conversations/{conversation_id}/resume accepts an empty
      request body and UUIDv4 idempotency key, locks a tenant-scoped
      non-closed conversation, resolves pending/claimed handoffs, sets status
      open, emits an audit event, and returns resolved handoff IDs. The function
      does not call the Sales Agent runtime, enqueue a turn, or manipulate the
      separate agent-memory checkpointer.
    evidence_refs: [E06, E16, E19, E26]
  provider_runtime_failure_boundary:
    statement: >-
      After /sales-agent/turn authentication, runtime/provider/gateway/invalid
      response failures are caught at the API boundary, logged through the
      sanitized diagnostic path, and rendered as an error response. No branch
      in that boundary calls request_handoff, resume_automation, or another
      canonical handoff writer.
    evidence_refs: [E13, E19, E20, E27, E28]

