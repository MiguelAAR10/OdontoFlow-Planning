facts:
  - id: F01
    statement: >-
      Conversation is tenant-owned and has statuses open, awaiting_confirmation,
      human_handoff, and closed; the active-contact partial unique index permits
      one non-closed conversation per organization/channel/contact.
    evidence_refs: [E02]
  - id: F02
    statement: >-
      ReceptionHandoff stores id, organization_id, conversation_id,
      contact_identity_id, reason_code, reason_summary, status, created_at, and
      updated_at. Reason codes are a seven-value closed set; statuses are
      pending, claimed, and resolved.
    evidence_refs: [E02, E03, E08]
  - id: F03
    statement: >-
      Handoff persistence is structurally tenant-bound by composite foreign keys
      (organization_id, conversation_id) to conversations and
      (organization_id, contact_identity_id) to contact_identities; the pending
      or claimed partial unique index is keyed by organization_id and conversation_id.
    evidence_refs: [E02, E03]
  - id: F04
    statement: >-
      request_handoff opens a transaction, claims an optional command receipt,
      requires conversations.manage, loads a tenant-scoped non-closed conversation
      and contact, reuses an existing pending/claimed row or inserts pending,
      sets Conversation.status to human_handoff, audits, settles the receipt, and
      returns the handoff.
    evidence_refs: [E05]
  - id: F05
    statement: >-
      The automation guard rejects a conversation in human_handoff with
      ENTITY_INACTIVE/HUMAN_HANDOFF_ACTIVE; the guard is used by the conversation
      loading path for LLM-facing tools.
    evidence_refs: [E05, E07, E23]
  - id: F06
    statement: >-
      New inbound persistence initializes a new conversation as open and dedupes
      an inbound event by organization, channel account, and provider_message_id;
      existing non-closed conversations are updated without an automatic
      human_handoff-to-open transition.
    evidence_refs: [E15]
  - id: F07
    statement: >-
      The generic agent-tool endpoint accepts request_human_handoff as an
      allowlisted mutation and dispatches it to run_handoff_tool; the Sales Agent
      V0 wrapper is conversation-bound and calls the same tool through its
      authenticated BackendGateway.
    evidence_refs: [E08, E09, E14, E18]
  - id: F08
    statement: >-
      Mutation transport requires tool_version 1.1 and a canonical UUIDv4
      idempotency key. run_handoff_tool names the operation
      conversations.request_handoff and includes conversation plus handoff
      arguments in the request fingerprint.
    evidence_refs: [E05, E08, E10]
  - id: F09
    statement: >-
      CommandReceipt uniqueness is organization_id plus operation plus
      idempotency_key. A matching fingerprint and principal replays the stored
      outcome; a different fingerprint/principal is rejected as an idempotency
      key reuse. Receipt, handoff mutation, and domain audit are committed
      together on the executed path.
    evidence_refs: [E10, E11]
  - id: F10
    statement: >-
      request_handoff emits conversation.human_handoff_requested with handoff id,
      reason code, and status. call_agent_tool additionally emits agent_tool.called
      for both successful and AppError tool calls. A replay does not rerun the
      domain command, while the generic tool boundary still records the call
      audit.
    evidence_refs: [E05, E09, E10]
  - id: F11
    statement: >-
      resume_automation requires conversations.resume, locks a tenant-scoped
      non-closed conversation, marks all pending/claimed handoffs for that
      conversation resolved, sets the conversation open, emits
      conversation.automation_resumed, and settles a conversations.resume_automation
      receipt.
    evidence_refs: [E06, E12, E16]
  - id: F12
    statement: >-
      The resume transport is POST /internal/conversations/{conversation_id}/resume
      with an empty typed body and required UUIDv4 Idempotency-Key. The route is
      permission-gated; the shipped reception-operator profile has
      conversations.read and conversations.resume only, while sales-agent-v0 has
      conversations.manage but not conversations.resume.
    evidence_refs: [E16, E21, E22, E23]
  - id: F13
    statement: >-
      The handoff status enum includes claimed, but the inspected source only
      queries pending/claimed and transitions those rows to resolved; no source
      function assigns claimed or exposes a handoff claim/list/detail route.
    evidence_refs: [E02, E06, E24, E30]
  - id: F14
    statement: >-
      The Sales Agent runtime invokes the typed handoff wrapper only for a
      GraphRecursionError bounded-loop fallback. Provider timeout, turn timeout,
      gateway, unavailable-runtime, invalid-response, and other runtime failures
      are converted to exceptions/diagnostics and handled by the API boundary;
      that boundary does not call request_handoff.
    evidence_refs: [E19, E20, E27]
  - id: F15
    statement: >-
      Existing failure diagnostics are content-free and allowlist stage/category,
      safe status/request identifiers, elapsed time, and partial_business_effects;
      raw exception/provider content, credentials, and patient messages are not
      serialized by the documented diagnostic contract.
    evidence_refs: [E19, E20, E27]
  - id: F16
    statement: >-
      SalesAgentTurnRequest contains only conversation_id and
      latest_inbound_message_id; the /sales-agent/turn route has no command
      receipt or request idempotency key in this contract. The existing handoff
      command itself is idempotent, but the turn boundary is not an idempotent
      command surface.
    evidence_refs: [E20, E21, E25]
  - id: F17
    statement: >-
      resume_automation changes canonical conversation/handoff rows and writes
      an audit event; its implementation has no Sales Agent runtime import or
      call. Runtime thread identity is separately derived from conversation_id
      in SalesAgentRuntime.invoke_config.
    evidence_refs: [E06, E19]
  - id: F18
    statement: >-
      The existing planning contract explicitly records sanitized diagnostics as
      present while a durable pending handoff after post-auth failure remains
      open; AGENT-02 is scoped to that remaining gap, not to provider fallback.
    evidence_refs: [E27, E29]

reuse_assessment:
  verdict: partial_reuse_existing_mechanism
  can_reuse_existing_handoff_domain: true
  reusable_parts:
    - statement: >-
        ReceptionHandoff persistence, controlled reason/status values, tenant
        composite keys, and one-open-handoff uniqueness already exist.
      evidence_refs: [E02, E03]
    - statement: >-
        request_handoff already provides an atomic idempotent command with the
        existing permission and audit conventions.
      evidence_refs: [E05, E10, E11]
    - statement: >-
        The existing operator resume route and conversations.resume permission
        already resolve active handoffs and reopen automation.
      evidence_refs: [E06, E12, E16, E22]
  reuse_limitations:
    - statement: >-
        The post-auth Sales Agent failure handlers do not call the existing
        request_handoff command, so the current mechanism is not currently
        reached for provider/runtime/API failure classes.
      evidence_refs: [E19, E20, E27, E29]
    - statement: >-
        The handoff row has no failure-diagnostic fields or claim ownership, and
        resume has no source-level connection to restarting or re-entering the
        Sales Agent runtime.
      evidence_refs: [E02, E06, E17, E19, E24]
  boundary: >-
    This is a reuse assessment from source evidence only. It does not select a
    new recovery architecture, add a route, define new states, or authorize
    implementation.

gaps:
  - id: G01
    statement: >-
      No durable human handoff is created when an authenticated /sales-agent/turn
      fails in provider/runtime/gateway/response handling; the API records only
      the sanitized diagnostic and returns the existing public error envelope.
    evidence_refs: [E19, E20, E27, E29]
  - id: G02
    statement: >-
      The existing handoff model cannot identify the failure boundary or partial
      business-effect evidence because it stores only controlled reason code and
      reason summary; the sanitized diagnostic remains outside canonical
      handoff persistence.
    evidence_refs: [E02, E05, E15, E27]
  - id: G03
    statement: >-
      claimed is a declared state but there is no source-level claim transition,
      claimant/ownership field, or claim/list/detail route for human operators.
    evidence_refs: [E02, E06, E24, E30]
  - id: G04
    statement: >-
      On recursion exhaustion, _request_handoff swallows handoff-tool failures
      into telemetry and SalesAgentRuntime.turn still returns handoff=true; the
      response therefore does not itself prove that a durable row was committed.
    evidence_refs: [E19, E25]
  - id: G05
    statement: >-
      Operator resume changes canonical state only; there is no source-level
      trigger that resumes the failed turn or coordinates with the separate
      agent-memory checkpointer.
    evidence_refs: [E06, E19, E26]
  - id: G06
    statement: >-
      The /sales-agent/turn request has no idempotency contract, so repeated
      authenticated turn requests are not deduped by the existing command
      receipt mechanism. The explicit handoff command has its own idempotency
      protections when invoked.
    evidence_refs: [E10, E20, E21, E25]

unknowns:
  - id: U01
    statement: >-
      The live database schema, migration application state, and live handoff
      rows were not inspected; this report covers declared models/migrations and
      source behavior only.
    reason: task boundary prohibits live database/schema inspection
    evidence_refs: [E02, E03]
  - id: U02
    statement: >-
      No backend source identifies a human operator UI or external worker that
      lists/claims ReceptionHandoff rows; whether an external caller polls the
      conversation list and then invokes resume is outside this repository.
    reason: no such caller was present in the inspected backend source; no external systems were inspected
    evidence_refs: [E16, E24, E30]
  - id: U03
    statement: >-
