      difficulty: medium
      recommended_worker_class: backend_security_engineer
      tests: ["401 on every flow route with compatibility explicitly enabled", "cross-organization credential denied", "authorized flows remain green", "redacted authentication audit evidence"]
      definition_of_done: "Lead-to-appointment routes no longer depend on the compatibility seam for identity and the full serial suite passes without reducing coverage."
    - id: CORE-03
      classification: DEFER_AFTER_V1
      business_outcome: "Catalog, location, practitioner, and schedule-rule setup commands also replay safely."
      why_required: "Uniform idempotency is useful, but setup commands are not on the Reception event-to-appointment critical path already protected by booking idempotency."
