      recommended_worker_class: backend_domain_engineer
      tests: ["authorized non-agent confirm creates one appointment", "same-key replay returns the same appointment", "agent remains INVALID_INPUT", "expired/cross-tenant/cross-location/conflicting proposals refuse", "concurrent confirms yield one winner", "decline is idempotent and audited atomically"]
      definition_of_done: "REST proposal list/read/confirm/decline commands use Idempotency-Key and the existing run_idempotent_command; agent refusal shares the authoritative implementation; OpenAPI and full serial PostgreSQL suite are green."
    - id: CORE-02
      classification: MUST_CLOSE_V1
      business_outcome: "Every Reception/Scheduling flow route rejects unauthenticated callers regardless of deployment configuration."
      why_required: "ERP anonymous compatibility currently makes tenant safety depend on a settings seam and can silently supply a system identity."
