  - "Agents select typed tools; they do not compute slots, prices, durations, consent, or bookings."
  - "n8n, OpenRouter, WhatsApp, and Supabase hosting are replaceable integration/deployment surfaces."
  - "No new framework, queue, fallback router, consent semantics, or parallel business architecture is required by this plan."
