done_contract:
  - id: DC-1
    clause: authenticated_event_enters_once
    statement: "A channel event reaches the domain through an authenticated canonical inbound command; replay of the same external event persists no second conversation, message, agent turn, outbound, or business action."
    current: "Persistence/idempotency tests exist; the -04 sender-origin 404/401 discrepancy leaves runtime entry unproven."
  - id: DC-2
    clause: airy_reads_current_state_through_authorized_tools
    statement: "AIRY reads services, locations, eligible practitioners, slots, contact profile, and appointments only through the tenant-bound authenticated typed-tool surface; it never reads the database or receives clinic state from n8n."
    current: "Typed gateway and bounded runtime exist; real-model proof remains unverified."
  - id: DC-3
    clause: deterministic_availability
    statement: "Server availability uses catalog duration, location timezone, rules, blocks, and appointments; identical inputs yield identical slots and model output cannot alter them."
    current: "Implemented and covered by deterministic availability tests."
  - id: DC-4
    clause: exactly_once_proposal
    statement: "A proposal command with the same idempotency key returns the same proposal and never creates a second pending proposal for the same conversation/service/practitioner/start."
    current: "Persistence exists through agent tools; canonical proposal command/API remains a closeout activity."
  - id: DC-5
    clause: exactly_one_authorized_appointment
    statement: "An authorized non-agent confirmation creates exactly one appointment; replay, expiry, cross-tenant, conflict, and concurrent confirmation are safe, while the agent principal remains refused."
    current: "Direct appointment booking is deterministic/idempotent; proposal acceptance path is missing and agent confirmation is fail-closed."
  - id: DC-6
    clause: truthful_failure_state
    statement: "Provider, runtime, transport, or ingress failure leaves sanitized diagnostic evidence and one recoverable human state, never a fabricated reply, false delivery, silent drop, retry, or duplicate mutation."
    current: "Sanitized diagnostics exist; a durable pending handoff after post-auth failure remains to close."
  - id: DC-7
    clause: no_n8n_business_logic
    statement: "n8n carries transport, credential forwarding, and canonical IDs only; removing it removes no availability, consent, proposal, or booking rule."
    current: "Artifacts exist; automated boundary assertions and live ownership are not yet closed."
  - id: DC-8
    clause: replaceable_providers_without_scheduling_rewrite
    statement: "Changing channel or model provider changes adapter/configuration only; scheduling/catalog/organization/idempotency/IAM code and tests remain provider-independent."
    current: "Architecture is separated; standing provider-boundary tests remain to be added."
  - id: DC-9
    clause: intentionally_manual_fail_closed
    statement: "Automatic agent booking, cancellation, and rescheduling remain refused at the authoritative command boundary; a visible authorized human path exists."
    current: "Booking is fail-closed; cancel/reschedule agent parity remains to be closed."
